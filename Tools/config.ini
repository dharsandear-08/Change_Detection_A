; DD_Style universal configuration
; Paths are relative to the project root.

[project]
name=DD_Style_Project

[output]
snapshot=ProjectSnapshot.txt
release_dir=release
zip_name={project_name}.zip

[options]
create_zip=true
pause_after_run=true

; Set true only when you intentionally want generated/output data in the ZIP.
include_output=false
include_release=false
include_git=false
include_venv=false
